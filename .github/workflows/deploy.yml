# Deploys this static site to Cloudflare Pages on every push to main.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages: Edit)
# and CLOUDFLARE_ACCOUNT_ID. The site is plain HTML, so there is no build step.
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=elevated-electrical-and-data --branch=main --commit-dirty=true
